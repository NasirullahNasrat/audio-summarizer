            </div>
            <button type="submit" class="btn btn-warning">
                <i class="bi bi-arrow-clockwise me-2"></i>Regenerate Summary
            </button>
        </form>
    </div>
</div>
{% endif %}

<!-- Real-time Status Updates -->
{% if recording.status != 'completed' and recording.status != 'failed' %}
<div class="card mt-4">
    <div class="card-header">
        <h5 class="mb-0"><i class="bi bi-hourglass-split me-2"></i>Live Status</h5>
    </div>
    <div class="card-body">
        <div class="text-center">
            <div class="spinner-border text-primary mb-3" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
            <p class="mb-2">Processing in progress...</p>
            <div class="progress mb-3" style="height: 20px;">
                <div class="progress-bar progress-bar-striped progress-bar-animated" 
                     id="liveProgress" style="width: 0%"></div>
            </div>
            <p class="text-muted mb-0" id="liveStatus">
                Current status: {{ recording.get_status_display }}
            </p>
            <small class="text-muted">
                This page will automatically update when processing is complete.
            </small>
        </div>
    </div>
</div>

<script>
    // Real-time status updates
    function checkStatus() {
        fetch("{% url 'transcriber:recording_status' recording.pk %}")
            .then(response => response.json())
            .then(data => {
                // Update status
                document.getElementById('liveStatus').textContent = 
                    'Current status: ' + data.status;
                
                // Update progress based on status
                let progress = 0;
                switch(data.status) {
                    case 'pending': progress = 10; break;
                    case 'transcribing': progress = 40; break;
                    case 'summarizing': progress = 70; break;
                    case 'completed': progress = 100; break;
                    case 'failed': progress = 0; break;
                }
                
                document.getElementById('liveProgress').style.width = progress + '%';
                
                // If completed or failed, reload page to show results
                if (data.status === 'completed' || data.status === 'failed') {
                    setTimeout(() => {
                        window.location.reload();
                    }, 2000);
                } else {
                    // Check again in 3 seconds
                    setTimeout(checkStatus, 3000);
                }
            })
            .catch(error => {
                console.error('Error checking status:', error);
                // Try again in 5 seconds on error
                setTimeout(checkStatus, 5000);
            });
    }
    
    // Start checking status
    document.addEventListener('DOMContentLoaded', checkStatus);
</script>
{% endif %}
{% endblock %}
